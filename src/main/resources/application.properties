spring.application.name=Backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smartattend?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Python AI Service URL
ai.service.url=http://localhost:8000

# JWT Properties
# 256-bit secret key (example, in production use a secure random key)
jwt.secret=4f6a7d8e9b0c1a2f3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c
jwt.expirationMs=86400000

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
